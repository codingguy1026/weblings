<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8fafc">
<meta name="description" content="Drawing Chat 클래식 메신저 UI 시제품">
<title>Drawing Chat · Classic</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-synthesis:none;color-scheme:light;--bg:#eef2f5;--paper:#fff;--side:#f7f9fb;--line:#e7ecf1;--text:#192b39;--muted:#82909d;--brand:#1e4e64;--brand2:#36758a;--soft:#e8f2f5;--mine:#d7e9ee;--hover:#edf2f5;--shadow:0 18px 50px rgba(35,61,80,.09)}
[data-theme="dark"]{color-scheme:dark;--bg:#131f29;--paper:#1d2b36;--side:#182630;--line:#31414e;--text:#e7eef3;--muted:#9aaab5;--brand:#95cfde;--brand2:#65a6bd;--soft:#294856;--mine:#315567;--hover:#263a48;--shadow:0 20px 48px rgba(0,0,0,.19)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}button{color:inherit}svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}.app{height:100dvh;min-height:500px;display:grid;grid-template-columns:74px 328px minmax(0,1fr);max-width:1500px;margin:auto;background:var(--paper);box-shadow:var(--shadow)}
.rail{background:#1b3142;color:#cadbe4;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:8px}.logo{width:39px;height:39px;border:1px solid #5b8296;border-radius:13px;color:#fff;display:grid;place-items:center;margin-bottom:23px;font-weight:800;font-size:19px;letter-spacing:-1px;background:#294d63}.rail button{border:0;background:transparent;color:inherit;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;position:relative}.rail button.active{background:#34576b;color:#fff}.rail button:hover{background:#345064}.rail button .dot{width:5px;height:5px;border-radius:50%;background:#a9d8df;position:absolute;bottom:4px}.rail-spacer{flex:1}.rail .avatar{border:1px solid #698799;color:#fff;background:#486a7c;font-size:12px;font-weight:700}
.panel{min-width:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}.panel-head{padding:29px 23px 15px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:2px;font-weight:700;margin-bottom:7px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading h1{font-size:23px;margin:0;letter-spacing:-.7px}.icon-btn{border:0;background:transparent;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}.icon-btn:hover{background:var(--hover);color:var(--text)}.search{margin:5px 23px 17px;border:1px solid var(--line);background:var(--paper);border-radius:11px;display:flex;align-items:center;gap:8px;padding:0 13px;color:var(--muted)}.search input{border:0;background:none;outline:0;color:var(--text);width:100%;padding:11px 0;font-size:13px}.search input::placeholder{color:var(--muted)}.list{overflow:auto;flex:1;padding:0 11px 20px}.list-title{font-size:11px;color:var(--muted);font-weight:700;padding:13px 13px 8px}.item{width:100%;display:flex;align-items:center;gap:12px;padding:13px 12px;border:0;text-align:left;border-radius:12px;background:transparent}.item:hover{background:var(--hover)}.item.selected{background:var(--soft)}.pfp{width:44px;height:44px;border-radius:16px;background:#d4e3eb;color:#345a6c;display:grid;place-items:center;flex:none;font-size:18px;font-weight:700}.pfp.pink{background:#f0dfec;color:#805875}.pfp.orange{background:#f5e9d9;color:#99764d}.pfp.green{background:#dcebdd;color:#447e63}.pfp.blue{background:#d9e8f4;color:#5678a5}.pfp.station{border-radius:14px}.item-content{min-width:0;flex:1}.item-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-sub{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{align-self:center;text-align:right;display:flex;flex-direction:column;align-items:end;gap:7px;flex:none}.item-time{font-size:10px;color:var(--muted)}.count{min-width:20px;height:20px;display:grid;place-items:center;border-radius:100px;background:#3e8da5;color:white;padding:0 5px;font-size:10px;font-weight:800}
.workspace{display:flex;flex-direction:column;min-width:0;position:relative}.conversation-head{height:81px;border-bottom:1px solid var(--line);padding:0 27px;display:flex;align-items:center;gap:12px;flex:none}.conversation-head .title-wrap{flex:1;min-width:0}.conversation-head h2{font-size:16px;margin:0 0 5px}.subline{font-size:11px;color:var(--muted)}.head-actions{display:flex;gap:3px}.status{display:inline-block;width:7px;height:7px;border-radius:50%;background:#62b49b;margin-right:4px}.messages{flex:1;min-height:0;overflow:auto;padding:28px 35px;display:flex;flex-direction:column;gap:17px;background:var(--paper)}.day{text-align:center;color:var(--muted);font-size:11px;padding-bottom:10px}.message{display:flex;gap:10px;align-items:flex-end;max-width:85%}.message.mine{align-self:flex-end;flex-direction:row-reverse}.message .pfp{width:33px;height:33px;font-size:13px;border-radius:12px}.bubble-wrap{display:flex;flex-direction:column;gap:5px;min-width:0}.sender{font-size:11px;color:var(--muted);padding-left:5px}.bubble{border-radius:15px 15px 15px 4px;padding:13px 15px;background:var(--soft);white-space:pre-wrap;word-break:break-word;line-height:1.65}.mine .bubble{border-radius:15px 15px 4px 15px;background:var(--mine)}.timestamp{color:var(--muted);font-size:10px;white-space:nowrap}.composer-wrap{padding:15px 23px 18px;border-top:1px solid var(--line)}.composer{display:flex;align-items:flex-end;gap:10px;border:1px solid var(--line);border-radius:15px;padding:8px;background:var(--paper)}.composer textarea{flex:1;border:0;resize:none;outline:none;background:transparent;color:var(--text);padding:10px 3px;min-height:41px;max-height:110px;line-height:1.6}.send{border:0;background:#25566c;color:white;border-radius:10px;width:39px;height:39px;display:grid;place-items:center;flex:none}.send:hover{background:#35758c}.send:disabled{opacity:.5}.fineprint{color:var(--muted);font-size:10px;margin:8px 5px 0}.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;height:100%;padding:25px;text-align:center}.empty .mark{display:grid;place-items:center;width:73px;height:73px;border-radius:22px;background:var(--soft);color:var(--brand)}.empty .mark svg{width:31px;height:31px}.empty h2{margin:4px 0 0;font-size:22px;letter-spacing:-.6px}.empty p{color:var(--muted);font-size:13px;line-height:1.9;max-width:340px}.primary{border:0;background:#25566c;color:white;border-radius:10px;padding:11px 16px;font-weight:700}.primary:hover{background:#36758a}.secondary{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 15px;font-weight:650}.detail-content{padding:35px;overflow:auto}.hero-title{font-size:27px;letter-spacing:-1px;margin:0 0 8px}.intro{line-height:1.8;color:var(--muted);margin:0 0 25px}.feature{display:flex;gap:13px;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:10px;align-items:center}.feature h3{font-size:14px;margin:0 0 5px}.feature p{font-size:12px;margin:0;color:var(--muted)}.feature .pfp{width:48px;height:48px}.feature .primary{margin-left:auto;white-space:nowrap}.switch{border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:9px 14px;font-size:12px;cursor:pointer}.switch.on{background:var(--soft);border-color:var(--brand2)}.notice{font-size:12px;color:var(--muted);background:var(--side);padding:13px 16px;border-radius:10px;line-height:1.7;margin-top:15px}.mobile-back{display:none}.mobile-nav{display:none}.mobile-header{display:none}.desktop-only{display:block}.toasts{position:fixed;right:25px;bottom:24px;z-index:20;background:#17394d;color:white;border-radius:12px;padding:12px 18px;font-size:12px;box-shadow:var(--shadow);max-width:290px}.kicker{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:700}
@media(max-width:900px){.app{grid-template-columns:66px 285px minmax(0,1fr)}.rail{padding-top:15px}.conversation-head{padding:0 16px}.messages{padding:24px 18px}.detail-content{padding:23px}.panel-head{padding-left:17px;padding-right:17px}.search{margin-left:17px;margin-right:17px}}
@media(max-width:680px){.app{grid-template-columns:minmax(0,1fr);min-height:0;height:100dvh}.rail{display:none}.panel{border-right:0;min-width:0;padding-bottom:66px}.panel-head{padding-top:22px}.heading h1{font-size:25px}.workspace{display:none}.app.detail-open .panel{display:none}.app.detail-open .workspace{display:flex}.app.detail-open .mobile-nav{display:none}.app.detail-open .mobile-back{display:grid}.mobile-nav{display:flex;position:absolute;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);height:66px;z-index:5;justify-content:space-around}.mobile-nav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;font-size:10px}.mobile-nav button.active{color:var(--brand);font-weight:700}.mobile-nav button svg{width:22px;height:22px}.mobile-header{display:block;margin:0 23px 10px;color:var(--muted);font-size:12px}.desktop-only{display:none}.mobile-back{border:0;background:none;width:34px;height:34px;place-items:center;color:var(--text);padding:0}.conversation-head{height:68px;padding:0 12px}.messages{padding:17px 14px}.composer-wrap{padding:12px}.detail-content{padding:22px}.item{padding:13px 12px}.toasts{left:20px;right:20px;bottom:80px}.feature{flex-wrap:wrap}.feature .primary{margin-left:0}}
@media(prefers-reduced-motion:no-preference){.item,.icon-btn,.send,.primary{transition:background .15s ease}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
"use strict";
const icons={
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8A8.5 8.5 0 0 1 12.5 20a8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>',
hash:'<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="11" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="13" y2="21"/>',
more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
back:'<path d="m15 18-6-6 6-6"/>',
send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.86 1.86-.06-.06A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1 1.56V21h-6v-1.04a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.86-1.86.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H2v-4h1.04A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88L4.2 7.06 6.06 5.2l.06.06A1.7 1.7 0 0 0 8 5.6a1.7 1.7 0 0 0 1-1.56V3h6v1.04a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.86 1.86-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1H22v4h-1.04A1.7 1.7 0 0 0 19.4 15z"/>',
shield:'<path d="m12 22 7-4V6l-7-4-7 4v12z"/><path d="m9 12 2 2 4-4"/>',
moon:'<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13z"/>',
share:'<path d="M8 12h13m-5-5 5 5-5 5"/><path d="M3 5v14"/>'
};
const ic=(name)=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[name]||icons.more)+'</svg>';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const contacts=[
{id:'hana',name:'하나',status:'오늘도 좋은 하루 🌿',initial:'하',color:'pink'},
{id:'min',name:'민준',status:'프로젝트 만드는 중',initial:'민',color:'blue'},
{id:'seo',name:'서윤',status:'안녕하세요!',initial:'서',color:'orange'},
{id:'ji',name:'지호',status:'',initial:'지',color:'green'}
];
const stations=[
{id:'dev',name:'Drawing 개발',desc:'새로운 Drawing 프로젝트에 대해 이야기해요.',initial:'#',color:'blue',members:124},
{id:'baseball',name:'야구 라운지',desc:'오늘의 야구 이야기를 자유롭게!',initial:'⚾',color:'green',members:86},
{id:'creative',name:'창작자 광장',desc:'그림, 글, 작품에 관한 대화.',initial:'✎',color:'pink',members:49}
];
const seeds={
'hana':[{from:'them',text:'오늘 뭐 하고 있어?',time:'12:20'},{from:'me',text:'드로잉 챗 화면 구상 중 ㅋㅋㅋ',time:'12:22'},{from:'them',text:'완성되면 보여줘!',time:'12:24'}],
'min':[{from:'them',text:'이번에 만든 화면 확인했어?',time:'11:48'}],
'seo':[{from:'them',text:'내일 보자!',time:'어제'}],
'ji':[],
'dev':[{from:'them',name:'서윤',text:'Station에 오신 걸 환영해요! 👋',time:'12:10'},{from:'them',name:'민준',text:'새 프로젝트 기대된다!',time:'12:15'}],
'baseball':[{from:'them',name:'야구 팬',text:'오늘 경기도 재미있겠다 ⚾',time:'12:14'}],
'creative':[{from:'them',name:'작가',text:'이번 주 작업물 같이 공유해요.',time:'어제'}]
};
const storeKey='drawing-chat-demo-v1';
let saved={};
try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch{}
const state={tab:'chats',selected:'hana',opened:false,query:'',messages:{...seeds,...(saved.messages||{})},theme:saved.theme==='dark'?'dark':'light',joined:Array.isArray(saved.joined)?saved.joined:['dev'],toast:''};
const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify({messages:state.messages,theme:state.theme,joined:state.joined}))}catch{}};
const root=document.getElementById('app');
function avatar(p){return '<span class="pfp '+(p.color||'blue')+(stations.some(s=>s.id===p.id)?' station':'')+'">'+esc(p.initial)+'</span>'}
function tabButton(tab,name,symbol){return '<button type="button" data-tab="'+tab+'" class="'+(state.tab===tab?'active':'')+'" aria-label="'+name+'" title="'+name+'">'+ic(symbol)+(state.tab===tab?'<span class="dot"></span>':'')+'</button>'}
function findEntry(id){return [...contacts,...stations].find(x=>x.id===id)}
function recent(id){const ms=state.messages[id]||[];return ms[ms.length-1]||null}
function item(p){const m=recent(p.id);const isStation=stations.some(s=>s.id===p.id);return '<button type="button" class="item '+(state.selected===p.id?'selected':'')+'" data-open="'+p.id+'">'+avatar(p)+'<span class="item-content"><span class="item-name">'+esc(p.name)+'</span><span class="item-sub">'+esc(isStation?p.desc:(m?.text||p.status||'대화를 시작해 보세요'))+'</span></span><span class="item-meta"><span class="item-time">'+esc(m?.time||'')+'</span></span></button>'}
function panel(){
const titles={friends:'친구',chats:'채팅',stations:'스테이션',more:'더보기'};
let dataset=state.tab==='friends'?contacts:state.tab==='stations'?stations:contacts.filter(x=>(state.messages[x.id]||[]).length);
dataset=dataset.filter(x=>(x.name+' '+(x.status||'')+' '+(x.desc||'')).toLowerCase().includes(state.query.toLowerCase()));
return '<aside class="panel"><div class="panel-head"><div class="eyebrow">DRAWING / CHAT</div><div class="heading"><h1>'+titles[state.tab]+'</h1><button class="icon-btn" type="button" data-action="new" aria-label="새 대화" title="새 대화">'+ic('plus')+'</button></div></div>'+
(state.tab==='more'?'':'<label class="search">'+ic('search')+'<input aria-label="목록 검색" id="search" placeholder="이름 또는 대화 검색" autocomplete="off" value="'+esc(state.query)+'"></label>')+
'<div class="list">'+(state.tab==='more'?'<div class="list-title">DRAWING CHAT</div><button class="item" data-action="theme">'+ic('moon')+'<span class="item-content"><span class="item-name">테마 변경</span><span class="item-sub">현재 '+(state.theme==='dark'?'다크':'라이트')+' 모드</span></span></button><button class="item" data-action="notice">'+ic('shield')+'<span class="item-content"><span class="item-name">개인정보 및 보안</span><span class="item-sub">데모 데이터 안내</span></span></button>':
'<div class="list-title">'+(state.tab==='friends'?'내 친구 · '+contacts.length+'명':state.tab==='stations'?'둘러보기 · '+stations.length+'개':'최근 대화')+'</div>'+(dataset.length?dataset.map(item).join(''):'<p class="notice">검색 결과가 없어요.</p>'))+'</div><div class="mobile-header">메시지 중심의 클래식 메신저 · UI 시제품</div></aside>'
}
function sideNav(){return '<nav class="rail" aria-label="주 메뉴"><div class="logo" aria-label="Drawing Chat">d.</div>'+tabButton('friends','친구','users')+tabButton('chats','채팅','chat')+tabButton('stations','스테이션','hash')+'<div class="rail-spacer"></div>'+tabButton('more','더보기','more')+'<button class="avatar" type="button" data-tab="more" aria-label="내 프로필">D</button></nav>'}
function mobileNav(){return '<nav class="mobile-nav" aria-label="하단 메뉴">'+[['friends','친구','users'],['chats','채팅','chat'],['stations','Station','hash'],['more','더보기','more']].map(([key,label,ico])=>'<button type="button" data-tab="'+key+'" class="'+(state.tab===key?'active':'')+'">'+ic(ico)+'<span>'+label+'</span></button>').join('')+'</nav>'}
function bubbles(id){const station=stations.some(s=>s.id===id);return (state.messages[id]||[]).map(m=>{const mine=m.from==='me';const name=m.name||(mine?'나':findEntry(id)?.name);return '<div class="message '+(mine?'mine':'')+'">'+(!mine?'<span class="pfp blue" aria-hidden="true">'+esc(name?.slice(0,1)||'?')+'</span>':'')+'<div class="bubble-wrap">'+(station&&!mine?'<span class="sender">'+esc(name)+'</span>':'')+'<div class="bubble">'+esc(m.text)+'</div></div><span class="timestamp">'+esc(m.time)+'</span></div>'}).join('')}
function conversation(p){
const station=stations.some(s=>s.id===p.id);
const joined=state.joined.includes(p.id);
return '<header class="conversation-head"><button type="button" class="mobile-back" data-action="back" aria-label="목록으로 돌아가기">'+ic('back')+'</button>'+avatar(p)+'<div class="title-wrap"><h2>'+esc(p.name)+'</h2><div class="subline">'+(station?esc(p.members+'명 참여 · Station'):'<span class="status"></span>개인 채팅 · 데모')+'</div></div><div class="head-actions"><button class="icon-btn" type="button" data-action="info" aria-label="대화 정보" title="대화 정보">'+ic('more')+'</button></div></header>'+
'<main class="messages" id="messages" aria-label="메시지 목록"><div class="day">DRAWING CHAT · UI 시제품</div>'+bubbles(p.id)+'</main>'+
(station&&!joined?'<div class="composer-wrap"><button class="primary" type="button" data-action="join" data-id="'+p.id+'">이 Station에 참여하기</button><div class="fineprint">참여 후 이 데모에서 메시지를 작성할 수 있어요.</div></div>':
'<form class="composer-wrap" id="composer"><div class="composer"><textarea id="draft" rows="1" maxlength="2000" placeholder="메시지 입력..." aria-label="메시지 입력"></textarea><button class="send" type="submit" aria-label="메시지 전송">'+ic('send')+'</button></div><div class="fineprint">Enter로 보내기 · Shift+Enter로 줄바꿈 · 이 브라우저에만 저장되는 시연용 메시지</div></form>')
}
function landing(){return '<div class="empty"><span class="mark">'+ic('chat')+'</span><span class="kicker">Connect people · Stay simple</span><h2>대화는 더 가볍게.</h2><p>친구와 이야기하고, 관심사로 모이는 공간.<br>Drawing Chat의 클래식 메신저 화면을 미리 살펴보세요.</p><button type="button" class="primary" data-action="begin">대화 시작하기</button></div>'}
function friendsPage(){return '<div class="detail-content"><div class="kicker">YOUR CONNECTIONS</div><h2 class="hero-title">친구와 바로 대화하세요.</h2><p class="intro">기존 메신저처럼 간단한 친구 목록. 소셜 피드를 강제로 끼워 넣지 않습니다.</p>'+contacts.map(p=>'<div class="feature">'+avatar(p)+'<div style="flex:1"><h3>'+esc(p.name)+'</h3><p>'+esc(p.status||'상태 메시지가 없습니다')+'</p></div><button type="button" data-talk="'+p.id+'" class="secondary">대화</button></div>').join('')+'</div>'}
function stationPage(){return '<div class="detail-content"><div class="kicker">OPEN CONVERSATIONS</div><h2 class="hero-title">Station에서 모여요.</h2><p class="intro">친구 채팅과 분리된 관심사 공간이에요. 채널에 직접 들어갈 때만 대화가 보여요.</p>'+stations.map(p=>'<div class="feature">'+avatar(p)+'<div style="flex:1"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+' · '+p.members+'명</p></div><button class="secondary" type="button" data-open="'+p.id+'">열기</button></div>').join('')+'</div>'}
function morePage(){return '<div class="detail-content"><div class="kicker">DRAWING ECOSYSTEM</div><h2 class="hero-title">메신저는 메신저답게.</h2><p class="intro">친구, 채팅, Station을 단순하고 분명하게 분리한 Drawing Chat UI 콘셉트입니다.</p><div class="feature">'+ic('moon')+'<div style="flex:1"><h3>화면 테마</h3><p>클래식 라이트 / 다크</p></div><button class="secondary" type="button" data-action="theme">'+(state.theme==='dark'?'라이트로':'다크로')+'</button></div><div class="notice"><strong>시제품 안내</strong><br>현재 Drawing ID 로그인, 실제 메시지 전송, 채팅방 권한, 푸시 알림, 종단간 암호화는 연결되어 있지 않습니다. 작성한 메시지는 이 브라우저의 로컬 저장소에만 저장됩니다. 개인정보나 비밀번호를 입력하지 마세요.</div><div style="margin-top:20px"><button class="secondary" type="button" data-action="reset">데모 메시지 초기화</button></div></div>'}
function workspace(){
let content=landing();
if(state.opened&&findEntry(state.selected))content=conversation(findEntry(state.selected));
else if(state.tab==='friends')content=friendsPage();
else if(state.tab==='stations')content=stationPage();
else if(state.tab==='more')content=morePage();
return '<section class="workspace" aria-label="대화 또는 상세 정보">'+content+'</section>'
}
function render(){
document.documentElement.dataset.theme=state.theme;
root.className='app'+(state.opened?' detail-open':'');
root.innerHTML=sideNav()+panel()+workspace()+mobileNav();
if(state.opened){const el=document.getElementById('messages');if(el)el.scrollTop=el.scrollHeight}
}
function toast(msg){document.querySelector('.toasts')?.remove();const el=document.createElement('div');el.className='toasts';el.setAttribute('role','status');el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3000)}
function open(id){state.selected=id;state.opened=true;state.tab=stations.some(s=>s.id===id)?'stations':'chats';state.query='';render()}
function action(name,id){switch(name){
case 'back':state.opened=false;render();break;
case 'new':state.tab='friends';state.opened=false;state.query='';render();toast('친구 목록에서 대화를 시작해 보세요.');break;
case 'begin':open('hana');break;
case 'theme':state.theme=state.theme==='dark'?'light':'dark';save();render();break;
case 'join':if(!state.joined.includes(id))state.joined.push(id);save();render();toast('Station에 참여했어요 (데모).');break;
case 'reset':state.messages=JSON.parse(JSON.stringify(seeds));save();render();toast('데모 메시지를 초기화했어요.');break;
case 'notice':toast('실제 서버나 Drawing ID에 연결되지 않은 UI 시제품입니다.');break;
case 'info':toast('대화 정보 기능은 다음 버전에 추가할 예정이에요.');break;
}}
document.addEventListener('click',e=>{
const btn=e.target.closest('[data-tab],[data-open],[data-talk],[data-action]');
if(!btn)return;
if(btn.dataset.tab){state.tab=btn.dataset.tab;state.opened=false;state.query='';render()}
else if(btn.dataset.open)open(btn.dataset.open);
else if(btn.dataset.talk)open(btn.dataset.talk);
else if(btn.dataset.action)action(btn.dataset.action,btn.dataset.id);
});
document.addEventListener('input',e=>{
if(e.target?.id!=='search')return;
const input=e.target;state.query=input.value;
const start=input.selectionStart;render();
const replacement=document.getElementById('search');
replacement?.focus();replacement?.setSelectionRange(start,start);
});
document.addEventListener('submit',e=>{
if(e.target?.id!=='composer')return;e.preventDefault();
const field=document.getElementById('draft');const value=field?.value.trim();
if(!value)return;
const time=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
(state.messages[state.selected]??=[]).push({from:'me',text:value,time});
save();render();document.getElementById('draft')?.focus();
});
document.addEventListener('keydown',e=>{
if(e.target?.id==='draft'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.getElementById('composer')?.requestSubmit()}
});
render();
</script>
</body>
</html>
